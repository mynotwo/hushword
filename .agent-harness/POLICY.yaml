version: 1
scope:
  allowed_paths:
  - '**'
  forbidden_paths:
  - .agent-harness/**
dependencies:
  allow_changes: false
  manifests:
  - Package.swift
  - Package.resolved
verification:
  commands:
  - name: core-tests
    run: swift run HushwordCoreTests
  - name: appkit-tests
    run: swift run HushwordAppKitTests
  - name: release-build
    run: swift build -c release --product Hushword
  - name: whitespace
    run: git diff --check
artifacts:
  required: []
